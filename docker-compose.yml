services:
  db:
    image: postgres:17-alpine
    container_name: voco-db
    environment:
      POSTGRES_USER: voco
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-voco}
      POSTGRES_DB: voco
    # No published port: the database is reachable only inside the Docker
    # network. For psql: docker compose exec db psql -U voco -d voco
    volumes:
      - voco-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voco -d voco"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    container_name: vokabeltrainer
    environment:
      # Enables the live-reload watcher (see server/server.js).
      NODE_ENV: development
      PGHOST: db
      PGUSER: voco
      PGPASSWORD: ${POSTGRES_PASSWORD:-voco}
      PGDATABASE: voco
      # Empty = no token. As soon as the port is no longer localhost-only,
      # set it: otherwise anyone who can reach it may write exercises.
      MCP_TOKEN: ${MCP_TOKEN:-}
      # Second port serving /mcp exclusively. Only that one gets tunnelled.
      MCP_PORT: ${MCP_PORT:-}
    # The working tree is mounted into the container, not just copied into
    # the image: changes are there immediately, no rebuild.
    # Deliberately the whole directory and not single files - editors save
    # by writing a temp file and renaming it. With a mount on a single file
    # the container then points at the old, deleted file and stops seeing
    # any changes. With a directory mount it does not.
    volumes:
      - ./:/app:ro
      # Anonymous volume: keeps node_modules from the image, which the host
      # folder (macOS) would otherwise shadow.
      - /app/node_modules
    # No authentication - hence localhost only. For phone access see README.
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Public HTTPS endpoint for clients that refuse a localhost URL.
  # Starts only with: docker compose --profile tunnel up -d
  # Deliberately points at the MCP-only port, not at the app.
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: voco-tunnel
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate --url http://app:8081
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  voco-db:
