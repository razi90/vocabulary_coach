services:
  db:
    image: postgres:17-alpine
    container_name: voco-db
    environment:
      POSTGRES_USER: voco
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-voco}
      POSTGRES_DB: voco
    # No published port: the database is reachable only inside the Docker
    # network. For psql: docker compose exec db psql -U voco -d voco
    volumes:
      - voco-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voco -d voco"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    container_name: vokabeltrainer
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/voco
      PGUSER: voco
      PGPASSWORD: ${POSTGRES_PASSWORD:-voco}
      # Encrypts the learners' API keys. Without it the coach cannot store one.
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?Bitte APP_ENCRYPTION_KEY in .env setzen - openssl rand -base64 32}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      REGISTRATION_CODE: ${REGISTRATION_CODE:-}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    # The frontend is mounted, not just copied: edits under web/ show up on
    # the next reload without a rebuild. Directory mount on purpose - editors
    # replace files by renaming, which a single-file mount would not see.
    volumes:
      - ./web:/app/web:ro
    ports:
      - "${APP_BIND:-127.0.0.1}:8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  voco-db:
