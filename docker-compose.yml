services:
  db:
    image: postgres:17-alpine
    container_name: voco-db
    environment:
      POSTGRES_USER: voco
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-voco}
      POSTGRES_DB: voco
    # Kein veröffentlichter Port: die Datenbank ist nur im Docker-Netz
    # erreichbar. Für psql: docker compose exec db psql -U voco -d voco
    volumes:
      - voco-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voco -d voco"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    container_name: vokabeltrainer
    environment:
      # Schaltet den Live-Reload-Watcher frei (siehe server/server.js).
      NODE_ENV: development
      PGHOST: db
      PGUSER: voco
      PGPASSWORD: ${POSTGRES_PASSWORD:-voco}
      PGDATABASE: voco
      # Leer = kein Token. Sobald der Port nicht mehr nur auf localhost liegt,
      # unbedingt setzen: sonst darf jeder Erreichbare Übungen schreiben.
      MCP_TOKEN: ${MCP_TOKEN:-}
      # Zweiter Port, der ausschließlich /mcp bedient. Nur er wird getunnelt.
      MCP_PORT: ${MCP_PORT:-}
    # Der Arbeitsbaum liegt als Mount im Container, nicht nur als Kopie im
    # Image: Änderungen sind sofort da, kein Rebuild.
    # Bewusst das ganze Verzeichnis und keine einzelnen Dateien – Editoren
    # speichern über "temp schreiben + umbenennen". Bei einem Mount auf eine
    # einzelne Datei zeigt der Container danach auf die alte, gelöschte Datei
    # und sieht keine Änderung mehr. Bei einem Verzeichnis-Mount nicht.
    volumes:
      - ./:/app:ro
      # Anonymes Volume: hält node_modules aus dem Image frei, sonst würde
      # der Host-Ordner (macOS) es überdecken.
      - /app/node_modules
    command: ["node", "--watch", "server/server.js"]
    # Ohne Anmeldung – deshalb nur localhost. Für Zugriff vom Handy siehe README.
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Öffentlicher HTTPS-Endpunkt für Clients, die keine localhost-URL annehmen.
  # Startet nur mit: docker compose --profile tunnel up -d
  # Zeigt bewusst auf den MCP-only-Port, nicht auf die App.
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: voco-tunnel
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate --url http://app:8081
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  voco-db:
