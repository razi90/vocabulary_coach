<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f0f11" media="(prefers-color-scheme: dark)">
  <title>Anmelden – Vokabeltrainer</title>
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🇪🇸</text></svg>">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="src/style.css">
</head>

<body>
  <main class="auth-page">
    <div class="auth-card">
      <div class="auth-brand">
        <span class="flag">🇪🇸 🇬🇧</span>
        <h1>Vokabeltrainer</h1>
        <p id="authSubtitle">Anmelden, um weiterzulernen</p>
      </div>

      <div class="form-note" id="authNote" hidden></div>
      <div class="form-error" id="authError" role="alert" hidden></div>

      <!-- Login -->
      <form id="loginForm" novalidate>
        <label class="field">
          <span class="field-label">E-Mail</span>
          <input type="email" name="email" autocomplete="username" required autofocus>
        </label>
        <label class="field">
          <span class="field-label">Passwort</span>
          <input type="password" name="password" autocomplete="current-password" required>
        </label>
        <button class="btn-primary" type="submit">Anmelden</button>
      </form>

      <!-- Registration -->
      <form id="registerForm" novalidate hidden>
        <label class="field">
          <span class="field-label">Name</span>
          <input type="text" name="displayName" autocomplete="nickname" maxlength="80">
        </label>
        <label class="field">
          <span class="field-label">E-Mail</span>
          <input type="email" name="email" autocomplete="username" required>
        </label>
        <label class="field">
          <span class="field-label">Passwort</span>
          <input type="password" name="password" autocomplete="new-password" required>
          <span class="field-help" id="passwordHelp">Mindestens 10 Zeichen.</span>
        </label>
        <label class="field">
          <span class="field-label">Einladungscode</span>
          <input type="text" name="code" autocomplete="off" required>
          <span class="field-help">Bekommst du von der Person, die den Trainer betreibt.</span>
        </label>
        <button class="btn-primary" type="submit">Konto anlegen</button>
      </form>

      <p class="auth-switch" id="toRegister" hidden>Noch kein Konto? <a href="#registrieren">Registrieren</a></p>
      <p class="auth-switch" id="toLogin" hidden>Schon ein Konto? <a href="#">Anmelden</a></p>
    </div>
  </main>
  <script src="src/auth.js"></script>
</body>

</html>
